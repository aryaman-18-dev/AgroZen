<script>
  (function initNavbarFavorites() {
    function updateNavFavCount() {
      try {
        const favs =
          JSON.parse(localStorage.getItem("AgroZen_favorite_blogs")) || [];
        const badge = document.getElementById("navFavoritesBadge");
        if (badge) {
          if (favs.length > 0) {
            badge.textContent = favs.length;
            badge.style.display = "inline-flex";
          } else {
            badge.style.display = "none";
          }
        }
      } catch (e) {}
    }
    updateNavFavCount();
    document.addEventListener("favoriteToggle", updateNavFavCount);
    document.addEventListener("DOMContentLoaded", updateNavFavCount);
  })();

  (function initNavbarLanguage() {
    function setupNavbarLang() {
      const trigger = document.getElementById("navbarLangTrigger");
      const container = document.getElementById("navbarLangContainer");
      const label = document.getElementById("navbarCurrentLang");
      const options = document.querySelectorAll(".navbar-lang-option");

      const names = {
        en: "English",
        hi: "हिन्दी",
        kn: "ಕನ್ನಡ",
        te: "తెలుగు",
        ta: "தமிழ்",
      };
      const current =
        localStorage.getItem("AgroZen-lang") ||
        localStorage.getItem("selectedLang") ||
        "en";

      if (label) {
        label.textContent = names[current] || current.toUpperCase();
      }

      options.forEach((opt) => {
        if (opt.getAttribute("data-lang-code") === current) {
          opt.classList.add("active");
        } else {
          opt.classList.remove("active");
        }
      });

      if (trigger && container) {
        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          container.classList.toggle("active");
        });

        document.addEventListener("click", () => {
          container.classList.remove("active");
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupNavbarLang);
    } else {
      setupNavbarLang();
    }

    window.addEventListener("languageChanged", (e) => {
      const lang = e.detail ? e.detail.lang : null;
      if (lang) {
        const names = {
          en: "English",
          hi: "हिन्दी",
          kn: "ಕನ್ನಡ",
          te: "తెలుగు",
          ta: "தமிழ்",
        };
        const label = document.getElementById("navbarCurrentLang");
        if (label) label.textContent = names[lang] || lang.toUpperCase();

        document.querySelectorAll(".navbar-lang-option").forEach((opt) => {
          if (opt.getAttribute("data-lang-code") === lang) {
            opt.classList.add("active");
          } else {
            opt.classList.remove("active");
          }
        });
      }
    });
  })();
</script>
